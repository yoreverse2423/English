<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e8">
  <meta name="description" content="小单词机：一款离线可用的轻量背单词应用，支持艾宾浩斯复习、发音与学习统计。">
  <title>小单词机 · 背单词</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <main class="app-main" id="app-main">
      <!-- 首页 -->
      <section class="view" id="view-home" data-view="home"></section>

      <!-- 学习新词 -->
      <section class="view study-view" id="view-study" data-view="study" hidden></section>

      <!-- 选择词书 -->
      <section class="view" id="view-books" data-view="books" hidden></section>

      <!-- 词表浏览 -->
      <section class="view" id="view-browse" data-view="browse" hidden></section>

      <!-- 复习 -->
      <section class="view" id="view-review" data-view="review" hidden></section>

      <!-- 每日阅读 -->
      <section class="view" id="view-reading" data-view="reading" hidden></section>

      <!-- 学习统计 -->
      <section class="view" id="view-stats" data-view="stats" hidden></section>

      <!-- 设置 -->
      <section class="view" id="view-settings" data-view="settings" hidden></section>
    </main>

    <!-- 手机底部导航 -->
    <nav class="tabbar" id="tabbar" aria-label="主导航">
      <button class="tab-item" type="button" data-nav="home" aria-label="首页">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.8 12 3l9 7.8"></path>
          <path d="M5.5 9.5V21h13V9.5"></path>
          <path d="M9.5 21v-6h5v6"></path>
        </svg>
        <span>首页</span>
      </button>
      <button class="tab-item" type="button" data-nav="browse" aria-label="词表">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"></path>
          <path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"></path>
          <path d="M8 7.5h8"></path>
        </svg>
        <span>词表</span>
      </button>
      <button class="tab-item" type="button" data-nav="review" aria-label="复习">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 11a8 8 0 1 0-2.3 6.2"></path>
          <path d="M20 4v7h-7"></path>
        </svg>
        <span>复习</span>
      </button>
      <button class="tab-item" type="button" data-nav="reading" aria-label="每日阅读">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 3.5h9l3 3V20.5H6z"></path>
          <path d="M15 3.5V7h4"></path>
          <path d="M8.5 11h7"></path>
          <path d="M8.5 14.5h7"></path>
          <path d="M8.5 18h4"></path>
        </svg>
        <span>每日阅读</span>
      </button>
      <button class="tab-item" type="button" data-nav="stats" aria-label="统计">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 20V11"></path>
          <path d="M10 20V4"></path>
          <path d="M16 20v-6"></path>
          <path d="M22 20H2"></path>
        </svg>
        <span>统计</span>
      </button>
      <button class="tab-item" type="button" data-nav="settings" aria-label="设置">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 6h16"></path>
          <path d="M4 12h16"></path>
          <path d="M4 18h16"></path>
          <circle cx="9" cy="6" r="2"></circle>
          <circle cx="15" cy="12" r="2"></circle>
          <circle cx="8" cy="18" r="2"></circle>
        </svg>
        <span>设置</span>
      </button>
    </nav>
  </div>

  <!-- 全局提示 -->
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- 备份文件选择器 -->
  <input class="visually-hidden" id="import-backup-input" type="file" accept=".json,application/json" tabindex="-1" aria-hidden="true">

  <noscript>
    <div class="noscript">请启用 JavaScript 后使用小单词机。</div>
  </noscript>

  <script src="app.js"></script>
</body>
</html>
